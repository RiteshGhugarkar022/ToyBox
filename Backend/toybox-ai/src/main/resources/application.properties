spring.application.name=toybox-ai
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/toyboxai
spring.datasource.username=postgres
spring.datasource.password=RG123

spring.jpa.hibernate.ddl-auto=update
